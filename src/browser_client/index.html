<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project SONAR – Home</title>

    <!-- External stylesheet(s) -->
    <link rel="stylesheet" href="styling/styles.css" />
  </head>

  <body>
    <!-- ───── Top bar (treated as a full‑page "slide") ───── -->
    <header class="top-bar page" id="top-bar">
      <div class="logo-container">
        <img src="assets/logo.png" alt="Project SONAR logo" class="logo" />
        <span class="project-name">Project SONAR</span>
      </div>

      <!-- Mobile hamburger -->
      <button class="hamburger-menu" id="hamburger-menu" aria-label="Toggle navigation">
        <span class="line"></span><span class="line"></span><span class="line"></span>
      </button>
    </header>

    <!-- ───── Mobile nav drawer ───── -->
    <nav class="mobile-nav" id="mobile-nav" aria-label="Primary">
      <ul>
        <li><a href="./index.html">Home</a></li>
        <li><a href="./about.html">About</a></li>
        <li><a href="./browser.html">Session</a></li>
        <li><a href="./sessions.html">Explore Sessions</a></li>
      </ul>
    </nav>

    <!-- ───── Hero (full‑page slide) ───── -->
    <section class="hero page" id="hero">
      <div class="hero-text">
        <h1>What’s our <span class="highlight">plan?</span></h1>
        <p>
          Project SONAR aims to create a collaborative framework for training
          and fine‑tuning ML models over decentralised datasets.
        </p>
        <div class="button-group">
          <a href="./about.html" class="btn about-btn">About Us</a>
          <a href="./sessions.html" class="btn explore-btn">Explore</a>
          <a href="./browser.html" class="btn training-btn">Start Training</a>
        </div>
      </div>
    </section>

    <!-- ───── Placeholder for future full‑page sections ───── -->
    <!--
    <section class="feature page"> … </section>
    <footer class="page"> … </footer>
    -->

    <!-- ───────────────── Scripts ───────────────── -->
    <script>
      /* ===== 1. Mobile hamburger toggle =================== */
      const hamburger = document.getElementById('hamburger-menu');
      const mobileNav = document.getElementById('mobile-nav');
      hamburger.addEventListener('click', () => mobileNav.classList.toggle('active'));

      /* ===== 2. Full‑page manual scrolling ================ */
      (() => {
        // All elements that should snap full‑screen
        const pages = [...document.querySelectorAll('.page')];
        if (!pages.length) return;

        let idx = 0;
        let lock = false;
        const animMs = 700; // duration must ≥ CSS scroll‑behavior timing

        const goTo = (i) => {
          if (i < 0 || i >= pages.length || lock) return;
          lock = true;
          idx = i;
          pages[i].scrollIntoView({ behavior: 'smooth' });
          setTimeout(() => (lock = false), animMs);
        };

        /* Wheel / track‑pad */
        window.addEventListener(
          'wheel',
          (e) => {
            if (lock) return;
            e.preventDefault(); // cancel native free‑scroll
            e.deltaY > 0 ? goTo(idx + 1) : goTo(idx - 1);
          },
          { passive: false }
        );

        /* Keyboard arrows & PgUp/PgDn */
        window.addEventListener('keydown', (e) => {
          if (lock) return;
          if (['ArrowDown', 'PageDown'].includes(e.key)) return goTo(idx + 1);
          if (['ArrowUp', 'PageUp'].includes(e.key)) return goTo(idx - 1);
        });

        /* Touch swipe (mobile) */
        let touchY = 0;
        window.addEventListener('touchstart', (e) => (touchY = e.touches[0].clientY));
        window.addEventListener('touchend', (e) => {
          const diff = touchY - e.changedTouches[0].clientY;
          if (Math.abs(diff) < 60 || lock) return; // ignore small drags
          diff > 0 ? goTo(idx + 1) : goTo(idx - 1);
        });
      })();
    </script>
  </body>
</html>
